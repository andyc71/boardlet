name: BoardScanner
options:
  deploymentTarget:
    iOS: '16.6'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 633764X8QU
    CODE_SIGNING_ALLOWED: YES
    'CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]': NO
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
packages:
  VoicePickerUI:
    path: ../Packages/VoicePickerUI
targets:
  BoardScanner:
    type: application
    platform: iOS
    dependencies:
      - package: VoicePickerUI
    sources:
      - App
      - ../Shared/SystemPhotoPicker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brightblue.BoardScanner.development
        INFOPLIST_KEY_CFBundleDisplayName: Board Scanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        NSPersonalVoiceUsageDescription: Speak your messages with your Personal Voice.
        UILaunchStoryboardName: LaunchScreen
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.brightblue.boardscan
            UTTypeDescription: Scanned Choice Board
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [boardscan]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.brightblue.tdsnap-pageset
            UTTypeDescription: TD Snap Page Set
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [sps]
        CFBundleDocumentTypes:
          - CFBundleTypeName: TD Snap Page Set
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.brightblue.tdsnap-pageset]
          - CFBundleTypeName: Scanned Choice Board
            LSHandlerRank: Owner
            LSItemContentTypes: [com.brightblue.boardscan]
  BoardScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, TestSupport]
    dependencies:
      - target: BoardScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brightblue.BoardScannerTests
  BoardScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - TestSupport
      - ../TestSupport/SystemPhotoPicker
    dependencies:
      - target: BoardScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brightblue.BoardScannerUITests
schemes:
  BoardScanner:
    build:
      targets:
        BoardScanner: all
    test:
      environmentVariables:
        TD_SNAP_FIXTURE: $(TD_SNAP_FIXTURE)
        TD_SYMBOL_LIBRARY: $(TD_SYMBOL_LIBRARY)
        TD_RECOVERED_OUTPUT: $(TD_RECOVERED_OUTPUT)
      targets:
        - name: BoardScannerTests
          skippedTests: [SpeechEngineTests]
        - name: BoardScannerUITests
          skippedTests: [RealScreenshotUITests, VoiceOverInputDiagnostics, FilesArtworkUITests, FilesBackupUITests]
  BoardScannerSpeechEngine:
    build:
      targets:
        BoardScanner: all
    test:
      targets:
        - name: BoardScannerTests
          selectedTests: [SpeechEngineTests]
  BoardScannerFileBackup:
    build:
      targets:
        BoardScanner: all
    test:
      targets:
        - name: BoardScannerUITests
          selectedTests: [FilesBackupUITests]
  BoardScannerFileArtwork:
    build:
      targets:
        BoardScanner: all
    test:
      environmentVariables:
        BOARD_SCANNER_ARTWORK_FIXTURE: $(BOARD_SCANNER_ARTWORK_FIXTURE)
      targets:
        - name: BoardScannerUITests
          selectedTests: [FilesArtworkUITests]
  BoardScannerVoiceOverInput:
    build:
      targets:
        BoardScanner: all
    test:
      targets:
        - name: BoardScannerUITests
          selectedTests: [VoiceOverInputDiagnostics]
  BoardScannerRealPhotos:
    build:
      targets:
        BoardScanner: all
    test:
      targets:
        - name: BoardScannerUITests
          selectedTests: [RealScreenshotUITests]
