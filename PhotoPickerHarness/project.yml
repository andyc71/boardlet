---
name: PhotoPickerHarness
options:
  deploymentTarget:
    iOS: '16.6'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: true
    CODE_SIGNING_ALLOWED: false
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
targets:
  PhotoPickerHarness:
    type: application
    platform: iOS
    sources:
    - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brightblue.PhotoPickerHarness
    dependencies:
    - package: SystemPhotoPicker
      product: SystemPhotoPicker
  PhotoPickerHarnessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - UITests
    dependencies:
    - target: PhotoPickerHarness
    - package: SystemPhotoPicker
      product: SystemPhotoPickerTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brightblue.PhotoPickerHarnessUITests
  PhotoPickerHarnessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    dependencies:
    - target: PhotoPickerHarness
    - package: SystemPhotoPicker
      product: SystemPhotoPicker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brightblue.PhotoPickerHarnessTests
schemes:
  PhotoPickerHarness:
    build:
      targets:
        PhotoPickerHarness: all
    test:
      gatherCoverageData: true
      targets:
      - PhotoPickerHarnessTests
      - PhotoPickerHarnessUITests
packages:
  SystemPhotoPicker:
    path: "../../SystemPhotoPicker"
