<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boardlet iPad landscape mockup</title>
  <style>
    @font-face {
      font-family: Baloo;
      src: url("../../fastlane/screenshots/fonts/Baloo2-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 2732px; height: 2048px; overflow: hidden; }
    body { font-family: Baloo, sans-serif; }
    .canvas { width: 2732px; height: 2048px; position: relative; overflow: hidden; background: #00aaff; }
    .title, .subtitle { color: white; position: absolute; z-index: 2; margin: 0; font-weight: 700; }
    .title { font-size: 140px; line-height: 1.03; }
    .subtitle { font-size: 100px; line-height: 1.04; }
    .device {
      position: absolute;
      width: var(--device-width);
      padding: 49px;
      border: 5px solid #c9d1d5;
      border-radius: 91px;
      background: #111;
      box-shadow: 0 32px 80px #02253355, inset 0 0 0 4px #414447;
      z-index: 1;
    }
    .device::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      top: 21px;
      left: 50%;
      transform: translateX(-50%);
      background: #202b34;
      box-shadow: inset 0 0 0 3px #0b1116;
    }
    .screen { width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 22px; background: #edf6ff; }
    .screen img { width: 100%; height: 100%; display: block; }
    .centered .title { top: 66px; left: 0; width: 100%; text-align: center; }
    .centered .subtitle { top: 248px; left: 0; width: 100%; text-align: center; }
    .centered .device { --device-width: 2050px; left: 341px; top: 447px; }
    .split::before { content: ""; position: absolute; width: 1050px; height: 1050px; border-radius: 50%; background: #33c5ff; left: -360px; top: -480px; }
    .split .accent { position: absolute; top: 338px; left: 124px; width: 165px; height: 23px; border-radius: 20px; background: #ffdd33; }
    .split .title { top: 420px; left: 110px; width: 830px; }
    .split .subtitle { top: 930px; left: 110px; width: 690px; }
    .split .device { --device-width: 1900px; left: 820px; top: 280px; }
    .focus::before { content: ""; position: absolute; width: 1560px; height: 1560px; border-radius: 50%; background: #33c5ff; left: -430px; bottom: -940px; }
    .focus .accent { position: absolute; top: 380px; right: 130px; width: 165px; height: 23px; border-radius: 20px; background: #ffdd33; }
    .focus .title { top: 445px; right: 120px; width: 640px; }
    .focus .subtitle { top: 965px; right: 120px; width: 640px; }
    .focus .device { --device-width: 1820px; left: 105px; top: 332px; }
  </style>
</head>
<body>
  <main class="canvas centered" id="canvas">
    <div class="accent" aria-hidden="true"></div>
    <h1 class="title" id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="device"><div class="screen"><img src="assets/preview.png" alt="Landscape iPad showing a Fruit board in Boardlet"></div></div>
  </main>
  <script>
    const variants = {
      centered: { title: "Create Choice Boards", subtitle: "From photos to print-ready pages" },
      split: { title: "Create<br>Choice<br>Boards", subtitle: "Ready to<br>print and use" },
      focus: { title: "Name your<br>board", subtitle: "Preview the<br>finished page" }
    };
    const variant = new URLSearchParams(location.search).get("variant") || "centered";
    const selected = variants[variant] || variants.centered;
    document.getElementById("canvas").className = `canvas ${variant}`;
    document.getElementById("title").innerHTML = selected.title;
    document.getElementById("subtitle").innerHTML = selected.subtitle;
  </script>
</body>
</html>
